name: Build Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Icône
        run: python tools/make_icon.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Compilation de l'exécutable
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build FortniteChestTracker.spec
      - name: Test de démarrage de l'exe compilé
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath dist\FortniteChestTracker.exe -ArgumentList "--selftest" -Wait -PassThru -RedirectStandardOutput out.txt
          Get-Content out.txt
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path out.txt -Pattern "SELFTEST OK")) { exit 1 }
      - name: Installateur
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc installer\FortniteChestTracker.iss
      - uses: actions/upload-artifact@v4
        with:
          name: FortniteChestTracker
          path: |
            dist/FortniteChestTracker.exe
            dist/FortniteChestTracker-Setup.exe
